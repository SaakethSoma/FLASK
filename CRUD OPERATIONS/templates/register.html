<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>

<body>

    <h1>Please DO register</h1>

    <form action="/api/students" method="POST">

        Enter id: <input type="text" name="id" required> <br><br>
        Enter name: <input type="text" name="name" required> <br><br>
        Enter email: <input type="email" name="email" required> <br><br>
        Enter course: <input type="text" name="course" required> <br><br>
        Enter phone number: <input type="number" name="phone" required> <br><br>

        <button type="submit">Register</button>

    </form>

</body>

</html>
