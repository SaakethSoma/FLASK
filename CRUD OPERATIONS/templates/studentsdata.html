<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Data</title>
</head>

<body>
    <table border="1" style="border-collapse: collapse;">
        <tr>
            <th>id</th>
            <th>name</th>
            <th>email</th>
            <th>course</th>
            <th>phone</th>
            <th colspan="2">Actions</th>
        </tr>


        {% for student in students %}

<tr>
    <td>{{ student[0] }}</td>
    <td>{{ student[1] }}</td>
    <td>{{ student[2] }}</td>
    <td>{{ student[3] }}</td>
    <td>{{ student[4] }}</td>

    <td>
        <a href="/edit/{{ student[0] }}">Edit</a>

        <a href="/delete/{{ student[0] }}">Delete</a>
    </td>
</tr>

{% endfor %}
    </table>
    <br><br>
    <h1><a href="/">Register</a></h1>
</body>

</html>
